[tool.poetry]
name = "pageplus"
version = "1.0.0"
description = ""
authors = ["JKamlah <jan.kamlah@uni-mannheim.de>"]
readme = "README.md"

[tool.poetry.scripts]
pageplus = "pageplus.main:app"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.17.3"}
lxml = "^6.0.1"
shapely = "^2.1.1"
python-dotenv = "^1.1.1"
requests = "^2.32.5"
urllib3 = "^2.5.0"
openpyxl = "^3.1.5"
json_repair = "^0.50.0"
pillow = "^11.3.0"
langcodes = "^3.5.0"
chardet = "^5.2.0"
uniseg = "^0.10.0"
jinja2 = "^3.1.6"
rapidfuzz = "^3.14.0"
attrs = "^25.3.0"
multimethod = "^2.0"
pikepdf = "^9.10.2"
google-genai = "^1.32.0"

# GUI-related packages
streamlit = { version = "^1.49.1", optional = true }
pyqt6 = { version = ">=6.7.0,<7", optional = true }

[tool.poetry.extras]
gui = ["streamlit", "pyqt6"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
